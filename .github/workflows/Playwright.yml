
name: Playwright Tests

on:
  # Scheduled execution: Daily at 9:00 PM IST
  schedule:
    - cron: '30 15 * * *'

  # Manual execution
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Environment'
        required: true
        type: choice
        default: 'Smoke'
        options:
          - Smoke
          - Sanity
          - Regression

      tags:
        description: 'Select Test Tag'
        required: true
        type: choice
        default: '@Smoke'
        options:
          - '@Smoke'
          - '@Sanity'
          - '@Regression'

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v6

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      # 3. Generate timestamp
      - name: Generate Timestamp
        run: |
          echo "BUILD_TIME=$(date -u +'%d-%b-%y_%H-%M-%S')" >> $GITHUB_ENV

      # 4. Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 5. Install Playwright browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 6. Execute Playwright tests
      - name: Run Playwright Tests
        env:
          TEST_ENV: ${{ inputs.environment || 'Regression' }}
          TEST_TAG: ${{ inputs.tags || '@Regression' }}
        run: |
          echo "Environment: $TEST_ENV"
          echo "Test Tag: $TEST_TAG"
          npx playwright test --grep "$TEST_TAG" --reporter=html

      # 7. Upload HTML report
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: Playwright-Report-${{ env.BUILD_TIME }}
          path: playwright-report/
          retention-days: 30